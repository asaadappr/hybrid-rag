[project]
name = "hybrid-rag"
version = "0.1.0"
description = "A hybrid RAG system that uses semantic + lexical search and reranking to respond"
readme = "README.md"
authors = [
    { name = "saad asif", email = "asif.saad19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = []


[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
